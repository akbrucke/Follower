name: Build & Package Follower

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows (VST3, Standalone & Installer)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake -B build -A x64

      - name: Build Release Targets
        run: cmake --build build --config Release --parallel

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y
          }
          & $iscc "installer\Follower.iss"

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Follower-Windows-Installer
          path: installer_out/*.exe

      - name: Publish Release Asset on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer_out/*.exe